[project]
name = "pybennu"
version = "6.0.0"
description = "bennu python providers and utilities"
authors = [
    { name = "Sandia National Laboratories", email = "emulytics@sandia.gov" },
]
license = "GPL-3.0-or-later"
requires-python = ">=3.10,<4.0"
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Operating System :: POSIX :: Linux',
    'Operating System :: Microsoft :: Windows',
    'Programming Language :: Python :: 3.10',                      # Ubuntu 22 (jammy)
    'Programming Language :: Python :: Implementation :: CPython',
]
dependencies = [
    # Elasticsearch client versions are forward-compatible
    # with the next major version, but are NOT backward-compatible with major versions.
    # They ARE backward-compatible with minor versions (e.g. 8.x)
    # https://www.elastic.co/docs/reference/elasticsearch/clients/python#_compatibility
    'elasticsearch<9.0.0',
    'matplotlib>=1.5.3',
    'networkx>=1.11',
    'numpy>=1.11.2',
    'opendssdirect.py~=0.6.1',
    'py-expression-eval==0.3.14',
    'PYPOWER==5.1.19',
    'pyserial>=3.4',
    'PyYAML>=3.12',
    'requests>=2.20',
    'scipy>=1.15.0',
    'labjack-ljm~=1.23.0',
    # NOTE: need at least pymodbus 3+. The version in apt
    # for ubuntu 22.04 is 2.1.0, which is too old.
    # NOTE: pymodbus 3.9.0 informally dropped support for Python 3.9
    'pymodbus>=3.8.0,<=3.9.2',
    'pydantic>2.0.0,<3.0.0',
    # NOTE: pydantic-settings 2.9.0 dropped support for Python 3.8
    'pydantic-settings',
    'bitarray;platform_system=="Linux"',        # ==2.3.2
    'sysv_ipc==1.1.0;platform_system=="Linux"',
    # force install the below from source so they are built with the
    # local libzmq libraries with draft support
    'pyzmq @ git+https://github.com/zeromq/pyzmq.git@v27.2.0',
    'helics @ git+https://github.com/GMLC-TDC/pyhelics.git@v3.6.1',
]

[project.urls]
Repository = "https://github.com/sandialabs/sceptre-bennu"

[project.scripts]
pybennu-power-solver = "pybennu.providers.power.power_daemon:server"
pybennu-power-load-forecaster = "pybennu.providers.power.utils.power_load_forecaster:server"
pybennu-sel-ams-reader = "pybennu.providers.power.utils.sel.sel_ams_reader:server"
pybennu-sel-ams-writer = "pybennu.providers.power.utils.sel.sel_ams_writer:server"
pybennu-groundtruth-monitor = "pybennu.analytics.groundtruth_monitor:main"
pybennu-test-ep-server = "pybennu.executables.pybennu_test_ep_server:main"
pybennu-test-ep-server-helics = "pybennu.executables.pybennu_test_ep_server_helics:main"
pybennu-test-subscriber = "pybennu.executables.pybennu_test_subscriber:main"
pybennu-probe = "pybennu.executables.pybennu_probe:main"
pybennu-alicanto = "pybennu.executables.pybennu_alicanto:main"
pybennu-siren = "pybennu.siren.siren:main"

[tool.uv.build-backend]
module-root = "."

[build-system]
requires = ["uv_build>=0.9.7"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Linting/code quality tools
# To install: pip install -e .[dev]
[project.optional-dependencies]
dev = [
    "codespell>=2.2.4",  # spelling
    "pytest",  # testing framework
    "pytest-cov",  # coverage reporting
    "ruff",  # powerful linter
    "vulture",  # checks for unused code
]

[tool.ruff]
# Same as Black.
line-length = 88
indent-width = 4

# requires-python >=3.10 (ubuntu 22.04)
target-version = "py310"

# exclude vendored and generated code outright
exclude = [
    "pybennu/pypmu/",
    "pybennu/distributed/swig/",
    "deps/",
    "build/",
    "dist/",
]

[tool.ruff.lint]
select = [
    "E",        # pycodestyle errors
    "W",        # pycodestyle warnings
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "A",        # flake8-builtins
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "PT",       # flake8-pytest-style
    "RSE",      # flake8-raise
    "RET",      # flake8-return
    "ARG",      # flake8-unused-arguments
    "RUF",      # Ruff-specific rules
]
# Each ignore below is pervasive in this codebase and a fix would change behavior or API:
ignore = [
    "E501",     # line-too-long https://docs.astral.sh/ruff/rules/line-too-long/
    "E722",     # bare except: also catches KeyboardInterrupt/SystemExit, relied on in daemon loops
    "UP031",    # printf-style formatting: 38 sites, manual conversion risks format drift
    "ARG",      # unused args: signal handlers, pydantic hooks, overrides and mocks fix the signature
    "B905",     # zip() strict=: would raise on mismatched lengths where it now truncates
    "B007",     # unused loop var: names kept for readability
    "A001",     # builtin shadowing (id, exit, vars): renaming locals is churn
    "A002",     # builtin-shadowing args (id): callers may pass by keyword
    "E741",     # ambiguous name `l`: domain-style short names in power-system code
    "E711",     # == None: may be numpy/pandas elementwise comparison
    "E712",     # == True: may be numpy/pandas elementwise comparison
    "RUF001",   # ambiguous unicode in a banner string
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["ARG"] # ignore unused-argument in test files

[tool.ruff.lint.isort]
known-first-party = ["pybennu"]

[tool.ruff.format]
# Like Black
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.vulture]
min_confidence = 80
paths = ["pybennu", "tests"]
exclude = [
    "pybennu/pypmu/",
    "pybennu/distributed/swig/",
]
# Signal-handler, classmethod and context-manager signatures are fixed by their callers.
ignore_names = ["signum", "stack", "frame", "cls", "settings_cls", "file_secret_settings",
                "exc_type", "exc_val", "exc_tb", "a", "k"]
