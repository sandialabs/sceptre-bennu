name: Build and test bennu and pybennu

on:
  pull_request:
    branches:
      - main
  push:
  workflow_dispatch:

jobs:
  build-bennu:
    # Builds debs for the ubuntu:22.04 images, so it stays on 22.04. On 24.04,
    # GCC 13 fails on libzmq 4.3.4 and on the vendored HELICS gmlc utilities.
    runs-on: ubuntu-22.04
    steps:
      - name: checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake g++ gcc libasio-dev libboost-date-time-dev libboost-filesystem-dev libboost-program-options-dev libboost-python-dev libboost-system-dev libboost-thread-dev libfreetype6-dev libssl-dev libzmq5-dev
      - name: configure bennu
        run: |
          mkdir build
          cd build/
          cmake ../
      - name: build bennu
        run: |
          cd build/
          make -j$(nproc)
      - name: test bennu
        run: |
          cd build/
          sudo make install
          sudo ldconfig
          bennu-test-ep-server --d 1 >ep.out 2>&1 &
          bennu-field-device --f ../data/configs/ep/dnp3-server.xml >fd-server.out 2>&1 &
          bennu-field-device --f ../data/configs/ep/dnp3-client.xml >fd-client.out 2>&1 &
          sleep 5
          bennu-probe --c query >probe.out
          grep "brkr" probe.out
          sleep 10
          bennu-probe --c read --t brkr >>probe.out
          bennu-probe --c read --t load-power >>probe.out
          sleep 3
          cat probe.out
          grep "brkr:true" probe.out
          grep "load-power:400.5" probe.out
          bennu-probe --c write --t load-breaker-toggle --s false >>probe.out
          bennu-probe --c write --t load-mw-setpoint --v 999 >>probe.out
          sleep 8
          bennu-probe --c read --t brkr >>probe.out
          bennu-probe --c read --t load-power >>probe.out
          sleep 3
          cat probe.out
          grep "brkr:false" probe.out
          grep "load-power:999" probe.out
          echo -e "help\nexit" | bennu-brash >brash.out 2>&1
          grep "SCEPTRE Field-Device" brash.out
          bennu-watcherd --help
          bennu-simulink-provider --help
          bennu-field-deviced --help
          bennu-simulink-provider-helics --help
      - name: run unit tests
        run: |
          cd build/
          ctest --output-on-failure
      - name: throughput regression guard (800 tags)
        # 800 output tags change every 1 s cycle; fails if a cycle takes over 2 s
        # (before batching it took ~400 s). See docs/performance.md.
        run: |
          pkill -f bennu-test-ep-server || true
          pkill -f bennu-field-device || true
          python3 -m pip install pyzmq
          python3 docker/test/throughput/gen.py 800 1000 tcp://127.0.0.1:5555 > /tmp/tp.xml
          THROUGHPUT_MAX_CYCLE_S=2.0 python3 docker/test/throughput/provider.py tcp://127.0.0.1:5555 20 p0 &
          pp=$!
          bennu-field-device --f /tmp/tp.xml > /tmp/tp-fd.out 2>&1 &
          fp=$!
          rc=0; wait $pp || rc=$?
          kill $fp 2>/dev/null || true
          exit $rc
      - name: build deb for bennu
        run: |
          cd build/
          sudo make package
          cp ./*.deb ../bennu.deb
      - name: check bennu deb installs
        run: |
          sudo dpkg -i bennu.deb
      - name: upload deb packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bennu deb
          if-no-files-found: error
          path: bennu.deb

  build-pybennu-dependencies:
    # Builds debs for the ubuntu:22.04 images, so it stays on 22.04. On 24.04,
    # GCC 13 fails on libzmq 4.3.4 and on the vendored HELICS gmlc utilities.
    runs-on: ubuntu-22.04
    steps:
      - name: checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install build dependencies
        run: |
          sudo apt update
          sudo apt install -y zstd checkinstall build-essential cmake git \
          wget python3-dev python3-pip libfreetype6-dev liblapack-dev libboost-dev ninja-build pipx
      - name: build libzmq deb
        run: |
          cd src/pybennu
          make libzmq-deb
      - name: check libzmq deb installs
        run: |
          cd src/pybennu
          make libzmq-install
      - name: build helics deb
        run: |
          cd src/pybennu
          make helics-deb
      - name: check helics deb installs
        run: |
          cd src/pybennu
          make helics-install
      - name: upload deb packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pybennu deb dependencies
          if-no-files-found: error
          path: src/pybennu/build/*.deb
      - name: deb file metadata
        shell: bash
        run: |
          for deb in src/pybennu/build/*.deb; do
            dpkg-deb --info "$deb"
          done

  build-pybennu-wheel:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake git \
          wget python3-dev python3-pip libfreetype6-dev liblapack-dev libboost-dev ninja-build pipx
      - name: build wheel
        run: |
          cd src/pybennu
          make dist
      - name: run pybennu unit tests
        run: |
          python3 -m pip install --break-system-packages pytest pyzmq "loguru>=0.7,<1"
          PYTHONPATH=src/pybennu python3 -m pytest src/pybennu/tests
      - name: upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pybennu wheel
          if-no-files-found: error
          path: src/pybennu/dist/pybennu*.whl

  test-gobennu:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config git wget cmake
      - name: build libzmq with draft API
        run: |
          wget -q https://github.com/zeromq/libzmq/releases/download/v4.3.5/zeromq-4.3.5.tar.gz
          tar xf zeromq-4.3.5.tar.gz
          cd zeromq-4.3.5
          ./configure --prefix=/usr/local --enable-drafts
          make -j$(nproc)
          sudo make install
          sudo ldconfig
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - name: go test
        run: |
          cd src/gobennu
          go test ./...

  release:
    # Create a new release when PRs targeting the default branch are merged
    # Also create a release when the workflow is triggered manually on the default branch
    if: |
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == github.event.repository.default_branch
      ) ||
      (
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-24.04
    needs:
      - build-pybennu-wheel
      - build-pybennu-dependencies
      - build-bennu
      - test-gobennu
    permissions:
      contents: write
    steps:
      - name: Determine release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG_BASE=$(date +'v%Y.%m.%d')
          TAG="$TAG_BASE"
          INCREMENT=1

          while gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || gh api "repos/${REPO}/git/ref/tags/${TAG}" --silent 2>/dev/null; do
            TAG_SHA=$(gh api "repos/${REPO}/commits/${TAG}" --jq .sha 2>/dev/null || true)
            if [ "$TAG_SHA" = "$TARGET" ]; then
              echo "Commit ${TARGET} is already released as ${TAG}."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TAG="${TAG_BASE}.${INCREMENT}"
            INCREMENT=$((INCREMENT + 1))
          done

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: get artifacts
        if: steps.tag.outputs.skip != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ./artifacts
          merge-multiple: true

      - name: show artifacts
        if: steps.tag.outputs.skip != 'true'
        run: |
          ls -lh ./artifacts

      - name: create release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
        run: |
          # Create as draft first so all assets are attached before publication (required for immutable releases)
          gh release create "$VERSION" ./artifacts/* \
            --repo "$REPO" \
            --title "$VERSION" \
            --generate-notes \
            --target "$TARGET" \
            --draft

          # Publish the release and mark it latest
          gh release edit "$VERSION" \
            --repo "$REPO" \
            --draft=false \
            --latest
