name: lint

on:
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: src/pybennu/pyproject.toml
      - name: Install dev tools
        run: make -C src/pybennu install-dev
      - name: Run checks
        run: make -C src/pybennu check

  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config git wget
      - name: Build libzmq with draft API
        run: |
          wget -q https://github.com/zeromq/libzmq/releases/download/v4.3.5/zeromq-4.3.5.tar.gz
          tar xf zeromq-4.3.5.tar.gz
          cd zeromq-4.3.5
          ./configure --prefix=/usr/local --enable-drafts
          make -j$(nproc)
          sudo make install
          sudo ldconfig
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          cache-dependency-path: src/gobennu/go.sum
      - name: Install golangci-lint
        run: make -C src/gobennu install-dev
      - name: Run checks
        run: make -C src/gobennu check

  codespell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - run: pip install "codespell>=2.2.4"
      - run: make codespell

  cpp-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-format-15
          sudo update-alternatives --install /usr/local/bin/clang-format clang-format /usr/bin/clang-format-15 100
      - name: Check changed C/C++ files
        run: make cpp-check CLANG_FORMAT=clang-format-15 GIT_CLANG_FORMAT=git-clang-format-15 BASE=origin/${{ github.base_ref || 'main' }}
