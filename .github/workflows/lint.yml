name: lint

on:
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install prek
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/j178/prek/releases/download/v0.5.7/prek-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate prek config
        run: prek validate-config prek.toml
      - name: Run prek
        # no-commit-to-branch stops local commits to main; skip it once code has landed there.
        env:
          PREK_SKIP: ${{ (github.ref == 'refs/heads/main') && 'no-commit-to-branch' || '' }}
        run: prek run --all-files --show-diff-on-failure

  cpp-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-format-15
          sudo update-alternatives --install /usr/local/bin/clang-format clang-format /usr/bin/clang-format-15 100
      - name: Check changed C/C++ files
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: make cpp-check CLANG_FORMAT=clang-format-15 GIT_CLANG_FORMAT=git-clang-format-15 BASE="origin/$BASE_REF"
