name: Commits

# Pull requests are rebase-merged and the release changelog is generated from
# the commit subjects on main, so every commit must follow Conventional Commits.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Conventional Commit subjects
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check the commit subjects
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          pattern='^(feat|fix|perf|docs|style|refactor|test|build|ci|chore|revert)(\([^)]+\))?!?: [^ ].*$'
          status=0
          subjects=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/commits" --jq '.[].commit.message | split("\n")[0]') || exit "$?"
          while IFS= read -r subject; do
            if [[ ! "$subject" =~ $pattern ]]; then
              echo "::error::Commit subject must follow Conventional Commits, e.g. 'fix(otsim): handle a missing scan-rate': ${subject}"
              status=1
            fi
          done <<< "$subjects"
          exit "$status"
